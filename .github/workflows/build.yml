name: Build

# Compiles and tests on every PR and push to main.
#
# There was no such job until now, and that is how a cross-repo break went
# unnoticed: the release workflow only runs `fatJar` (main sources, on demand),
# so a contract change in BossConsole that this repo could no longer compile
# against only surfaced at the next release attempt. `build` covers the test
# source set too, which is where the transport direction is asserted.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # CI=true makes build.gradle.kts skip the sibling-checkout branch and
      # download the contract jars instead.
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace
